name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -c "from app.main import create_app; create_app()"
      - run: DATABASE_URL=sqlite:////tmp/swasthiq_ci.db python -m alembic upgrade head
      - run: python -m pytest -m "not live_nvidia" -q
      - run: python -c "import json; from pathlib import Path; from app.main import create_app; Path('../docs/contracts').mkdir(parents=True, exist_ok=True); Path('../docs/contracts/openapi.json').write_text(json.dumps(create_app().openapi(), indent=2, sort_keys=True), encoding='utf-8')"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "25.6"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run generate:api
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test ! -f .env
      - run: test ! -f SwasthiQ-Hiring-Assignment-July.pdf
      - run: "! git ls-files | grep -E '(^|/)(node_modules|coverage|dist|.*\\.db|.*\\.sqlite3)$'"
      - run: "! git grep -nE 'NVIDIA_API_KEY=.+|BEGIN (RSA|OPENSSH|PRIVATE) KEY|sk-[A-Za-z0-9]' -- . ':!README.md' ':!backend/.env.example'"
